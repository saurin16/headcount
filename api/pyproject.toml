[project]
name = "headcount"
version = "0.1.0"
description = "Headcount: Qloo-powered multi-agent show demand forecaster"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
